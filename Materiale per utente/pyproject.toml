[project]
name = "excel-pipeline"
version = "0.1.0"
description = "Standalone Excel transformation pipeline (Sunrise + Astra input builders)."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel_pipeline"]
